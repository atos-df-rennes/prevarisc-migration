  updated_at: "2026-04-22"
  notes: >
    Correction des classes CSS hidden sur les champs planification,
    correction off-by-one sur la sélection multi-dates (FullCalendar v1.6.4 end inclusif),
    correction des sélecteurs jQuery dans calendar-init.js (dossier) et
    du DateCollectionObserver pour #addReapeat et #planification.
    Ajout exportOutlookAction (ICS date unique, bug ligne 1539 non reproduit),
    ajout exportOutlookMoisAction (ICS mensuel avec ODJ),
    ajout IcalendarController + IcalendarSyncService (endpoint webcal /api/1.0/calendar),
    installation sabre/vobject ^4.5,
    accès public /api/1.0/calendar (security.php),
    correction lien gestionodj.html.twig vers route Symfony,
    activation lien export Outlook mensuel dans calendrier-commissions.js.
  routes:
    - name: calendrier_des_commissions_export_outlook
      path: /commissions/calendrier/export-outlook/{dateCommId}
    - name: calendrier_des_commissions_export_outlook_mois
      path: /commissions/calendrier/export-outlook-mois/{commId}/{mois}/{annee}
    - name: api_icalendar_sync
      path: /api/1.0/calendar
