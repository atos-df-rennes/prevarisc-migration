  notes: |
    Port direct complet ✅
    - DossierRapportController.php : rapportAction + generationrapportAction
    - DossierRapportOdtService.php : port de creationdocAction + creationdoc.phtml (~800 lignes)
      - Tous les champs ODT (dateDuJour, dossier, établissement, contacts, prescriptions, etabDesc, formulaires)
      - 11 contacts avec fallback dossier→établissement
      - Segments prescription (listeReg/Exploitation/Amelioration × all/reprises/actuelles)
      - Logique CC celluleDossier / celluleDossierLevee
      - Formulaires (capsules rubriques via Descriptif service)
      - Avis/dérogations dossier + établissement
      - Sauvegarde ODT + création PieceJointe/DossierPieceJointe
    - rapport.html.twig : Bootstrap 2→3 complet (row-fluid→row, span2→col-md-2, span10→col-md-10)
    - PrescriptionArrayHelper.php : helpers statiques extraits (withoutLevees, withoutActuals, withoutPrevious, buildTextearticle, getPrescriptionSegmentName) — 12 tests unitaires
    - ValeurResolver.php : résolution valeur→string extraite de DossierRapportOdtService — 12 tests unitaires
    
    Correctifs appliqués (2025-05) :
    - typeDossier : LIBELLE_DOSSIERTYPE via jointure dossiertype
    - établissementAdresse : ajout CODEPOSTAL_COMMUNE + LIBELLE_COMMUNE
    - numTelEtab/numFaxEtab/mailEtab : correction noms colonnes DB
    - categorieEtab : premier mot uniquement (explode ' ')[0]
    - prochaineVisite : calcul depuis DATEVISITE + PERIODICITE, format "mois année" FR
    - desenfNaturel/Mecanique et col sèches/humides/RIA/sprinkleur/brouillardEau : 'Oui'/'Non'
    - listeDocs : seuls les documents consultés sont affichés (avec coche)
    - adresse maire : colonnes NUMEROADRESSE/RUEADRESSE/CPADRESSE/VILLEADRESSE
    - prescriptions : champs num/libelle/textearticle (articles concaténés), mergeSegment correct
    - PHPStan niveau 10 : 0 erreur (DossierRapportOdtService, PrescriptionArrayHelper)

    Écarts intentionnels résiduels :
    - prochaineVisite : option use_date_commission_for_periodicity (config legacy) non portée — utilise DATEVISITE uniquement
    - descriptionEffectif*/descriptionDegagement* : null (pas d'équivalent)
    - Typo legacy 'prenomDemandeurt' préservée intentionnellement

