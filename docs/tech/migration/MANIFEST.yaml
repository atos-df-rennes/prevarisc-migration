    Template displayPjPlatau : chemin adapté en dossier/pieces_jointes/_platau_exportables.html.twig
    car templates/dossier/_platau_pieces_jointes.html.twig est déjà utilisé par le formulaire Platau (edit.html.twig).
    Sélection commission (PJ_COMMISSION / pjPassageCommission) omise :
    handler AJAX absent en legacy, checkbox non rendue dans display.phtml. Noté dans rapport d'écarts.
