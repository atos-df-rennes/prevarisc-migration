name: "Copilot Setup Steps"

# Exécuté automatiquement lors des modifications pour valider la configuration,
# et manuellement depuis l'onglet "Actions" du dépôt pour tester l'environnement.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # Le job DOIT s'appeler `copilot-setup-steps` pour être reconnu par Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        permissions:
            contents: read

        steps:
            - name: Checkout prevarisc-migration
              uses: actions/checkout@v4

            # prevarisc-migration est le dépôt de l'agent, mais Docker Compose, Castor
            # et les scripts d'infrastructure sont dans prevarisc-infra (dépôt séparé).
            # On le clone dans un répertoire frère du workspace de l'agent.
            - name: Set workspace paths
              run: |
                  INFRA_DIR="$(realpath "$GITHUB_WORKSPACE/../prevarisc-infra")"
                  echo "PREVARISC_INFRA_DIR=$INFRA_DIR" >> "$GITHUB_ENV"
                  echo "Infra dir : $INFRA_DIR"

            - name: Clone prevarisc-infra
              run: |
                  git clone --depth=1 --branch develop \
                      https://github.com/atos-df-rennes/prevarisc-infra.git \
                      "$PREVARISC_INFRA_DIR"

            # Le legacy est en lecture seule — l'agent n'y écrit jamais.
            - name: Clone prevarisc (legacy — read-only)
              run: |
                  git clone --depth=1 --branch develop \
                      https://github.com/atos-df-rennes/prevarisc.git \
                      "$PREVARISC_INFRA_DIR/prevarisc"

            # Les volumes Docker Compose (./prevarisc-migration, ./prevarisc) sont
            # relatifs à prevarisc-infra/. On crée un lien symbolique pour que le
            # workspace de l'agent soit monté dans les conteneurs.
            - name: Link workspace into infra directory
              run: |
                  ln -s "$GITHUB_WORKSPACE" "$PREVARISC_INFRA_DIR/prevarisc-migration"
                  echo "Symlink créé : $PREVARISC_INFRA_DIR/prevarisc-migration -> $GITHUB_WORKSPACE"

            # Binaire statique castor — pas de dépendance PHP requise sur le runner.
            # Le wrapper garantit que castor s'exécute toujours depuis prevarisc-infra/
            # (requis car les tâches castor référencent compose.dev.yaml en chemin relatif).
            - name: Install Castor
              run: |
                  curl -LSf "https://github.com/jolicode/castor/releases/download/v1.3.0/castor.linux-amd64" \
                      -o /usr/local/bin/castor-bin
                  chmod +x /usr/local/bin/castor-bin

                  cat > /usr/local/bin/castor << 'EOF'
                  #!/bin/bash
                  cd "$PREVARISC_INFRA_DIR" && /usr/local/bin/castor-bin "$@"
                  EOF
                  chmod +x /usr/local/bin/castor
                  castor --version

            # L'override compose.agent.yaml supprime les hooks post_start de compose.dev.yaml
            # (introduits en Docker Compose 2.30, potentiellement absents du runner).
            - name: Start Docker Compose services
              run: |
                  docker compose \
                      --file "$PREVARISC_INFRA_DIR/compose.dev.yaml" \
                      --file "$PREVARISC_INFRA_DIR/compose.agent.yaml" \
                      up -d
                  docker compose --file "$PREVARISC_INFRA_DIR/compose.dev.yaml" ps

            # Remplace les hooks post_start supprimés par l'override compose.agent.yaml.
            - name: Create upload directories
              run: |
                  docker compose --file "$PREVARISC_INFRA_DIR/compose.dev.yaml" exec -T app bash -c '
                      mkdir -p /var/www/html/prevarisc/public/data/uploads/{commission,dossier,etablissement,etablissement_miniature} &&
                      mkdir -p /var/www/html/prevarisc/public/data/uploads/documents/{1,2,3,4} &&
                      chmod -R 775 /var/www/html/prevarisc/public/data
                  '

            - name: Wait for MySQL to be ready
              run: |
                  echo "Waiting for MySQL..."
                  timeout 60 bash -c '
                      until docker compose --file "$PREVARISC_INFRA_DIR/compose.dev.yaml" exec -T db \
                          mysqladmin ping -u prevarisc -pplanmusique --silent 2>/dev/null
                      do
                          echo "  MySQL not ready yet, retrying in 2s..."
                          sleep 2
                      done
                  '
                  echo "MySQL is ready."

            # vendor/ et tools/vendor/ sont dans .gitignore, les deux doivent être installés.
            # - app (PHP 7.1)   : dépendances runtime de l'application Symfony
            # - platau (PHP 8.1): outils de dev (PHPStan, Rector, PHP-CS-Fixer, Twig-CS-Fixer)
            - name: Install Composer dependencies (app — PHP 7.1)
              run: |
                  docker compose --file "$PREVARISC_INFRA_DIR/compose.dev.yaml" exec -T \
                      -w /var/www/html/prevarisc-migration \
                      app \
                      composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

            - name: Install Composer dependencies (tools — PHP 8.1)
              run: |
                  docker compose --file "$PREVARISC_INFRA_DIR/compose.dev.yaml" exec -T \
                      -w /var/www/html/prevarisc-migration/tools \
                      platau \
                      composer install --no-interaction --prefer-dist --no-progress

            - name: Run Doctrine migrations
              run: castor symfony:migrate

            - name: Clear Symfony cache
              run: castor symfony:cache

            # Smoke check : valide que tout l'environnement est fonctionnel.
            - name: Validate setup — PHPStan
              run: castor symfony:analyse
