name: Prevarisc CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ENV: dev
  APP_DEBUG: '1'
  APP_SECRET: ci-only-not-a-production-secret
  APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
  DATABASE_URL: 'mysql://ci:ci@127.0.0.1:3306/prevarisc_ci?serverVersion=11.8.8-MariaDB&charset=utf8mb4'

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      php: ${{ steps.changes.outputs.php || steps.push.outputs.php }}
      twig: ${{ steps.changes.outputs.twig || steps.push.outputs.twig }}
    steps:
      - name: Filter changed files
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            php:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'tools/composer.json'
              - 'tools/composer.lock'
              - 'config/**'
              - 'phpstan*.neon*'
              - 'phpunit.xml.dist'
              - '.env'
              - '.env.test'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            twig:
              - '**/*.twig'
              - '.twig-cs-fixer.dist.php'
              - 'linter/**'
              - 'tools/composer.json'
              - 'tools/composer.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
      - name: Run all checks for pushes
        id: push
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "php=true" >> "$GITHUB_OUTPUT"
          echo "twig=true" >> "$GITHUB_OUTPUT"

  phpstan:
    name: PHPStan
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          app: 'true'
          tools: 'true'
      - name: Restore PHPStan cache
        uses: actions/cache@v6
        with:
          path: var/cache/phpstan
          key: ${{ runner.os }}-php85-phpstan-${{ hashFiles('composer.lock', 'tools/composer.lock', 'phpstan*.neon*', 'config/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-php85-phpstan-${{ hashFiles('composer.lock', 'tools/composer.lock', 'phpstan*.neon*', 'config/**') }}-
      - name: Analyse PHP
        run: tools/vendor/bin/phpstan --memory-limit=-1 --no-progress

  rector:
    name: Rector
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          app: 'true'
          tools: 'true'
      - name: Restore Rector cache
        uses: actions/cache@v6
        with:
          path: var/cache/rector
          key: ${{ runner.os }}-php85-rector-${{ hashFiles('composer.lock', 'tools/composer.lock', 'rector.php') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-php85-rector-${{ hashFiles('composer.lock', 'tools/composer.lock', 'rector.php') }}-
      - name: Check refactoring
        run: tools/vendor/bin/rector --dry-run --no-progress-bar

  php-cs-fixer:
    name: PHP-CS-Fixer
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'true'
      - name: Restore PHP-CS-Fixer cache
        uses: actions/cache@v6
        with:
          path: .php-cs-fixer.cache
          key: ${{ runner.os }}-php85-php-cs-fixer-${{ hashFiles('tools/composer.lock', '.php-cs-fixer.dist.php') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-php85-php-cs-fixer-${{ hashFiles('tools/composer.lock', '.php-cs-fixer.dist.php') }}-
      - name: Check PHP style
        run: tools/vendor/bin/php-cs-fixer fix --dry-run --diff

  twig-cs-fixer:
    name: Twig-CS-Fixer
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.twig == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'true'
      - name: Restore Twig-CS-Fixer cache
        uses: actions/cache@v6
        with:
          path: .twig-cs-fixer.cache
          key: ${{ runner.os }}-php85-twig-cs-fixer-${{ hashFiles('tools/composer.lock', '.twig-cs-fixer.dist.php', 'linter/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-php85-twig-cs-fixer-${{ hashFiles('tools/composer.lock', '.twig-cs-fixer.dist.php', 'linter/**') }}-
      - name: Check Twig style
        run: tools/vendor/bin/twig-cs-fixer check

  phpunit:
    name: PHPUnit
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          app: 'true'
      - name: Run tests without database-dependent scenarios
        run: php vendor/bin/phpunit --testdox --exclude-group functional

  conflicts:
    name: Git conflict markers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'true'
      - name: Check conflict markers
        run: >-
          tools/vendor/bin/swiss-knife check-conflicts .
          --exclude /.git/
          --exclude /var/
          --exclude /public/bundles/
          --exclude /cypress/screenshots/
          --exclude /cypress/videos/
          --exclude /bin/.phpunit/
          --exclude /vendor/
          --exclude /node_modules/

  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSER_AUDIT_ABANDONED: ignore
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Audit application dependencies
        run: composer audit --locked
      - name: Audit tooling dependencies
        if: ${{ !cancelled() }}
        working-directory: tools
        run: composer audit --locked

  ci:
    name: CI
    if: always()
    needs:
      - changes
      - phpstan
      - rector
      - php-cs-fixer
      - twig-cs-fixer
      - phpunit
      - conflicts
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a check failed or was cancelled
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 1
